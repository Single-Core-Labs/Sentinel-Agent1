[package]
name = "sentinel-ai-tui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
opentui-native = []

[dependencies]
colored = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
ratatui = "0.26"
crossterm = "0.27"
futures = "0.3"
# Use the exec crate for shared logic
sentinel-ai-exec = { workspace = true }
sentinel-app-server-client = { workspace = true }
sentinel-app-server = { workspace = true }
sentinel-config = { workspace = true }
sentinel-analytics = { workspace = true }
sentinel-tools = { workspace = true }
sentinel-app-server-protocol = { workspace = true }
sentinel-headroom = { workspace = true }
sentinel-core = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
fastrand = "2"
async-trait = { workspace = true }
