[package]
license = "Apache-2.0"
name = "sentinel-ai-sampling-types"
version = "0.1.0"
edition.workspace = true
description = "Pure data types for the AI sampling / chat-completion API layer"

[dependencies]
async-openai = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
sentinel-circuit-breaker = { workspace = true }
sentinel-ai-compaction = { path = "../../common/sentinel-ai-compaction" }
sentinel-ai-tools = { path = "../sentinel-ai-tools" }

[dev-dependencies]
assert_matches = { workspace = true }

[lints]
workspace = true
