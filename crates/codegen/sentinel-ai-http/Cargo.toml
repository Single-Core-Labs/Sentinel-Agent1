[package]
license = "Apache-2.0"
name = "sentinel-ai-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the ai CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sentinel-ai-auth = { workspace = true, features = ["middleware"] }
sentinel-ai-extra-ca = { workspace = true }
sentinel-ai-sampler = { path = "../sentinel-ai-sampler" }
sentinel-ai-telemetry = { workspace = true }
sentinel-ai-version = { workspace = true }
sentinel-ai-workspace = { workspace = true }

[lints]
workspace = true
