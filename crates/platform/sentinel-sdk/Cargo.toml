[package]
name = "sentinel-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Programmatic SDK for building and interacting with Sentinel AI agents"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true

sentinel-core = { workspace = true }
sentinel-provider = { workspace = true }
sentinel-tools = { workspace = true }
sentinel-config = { workspace = true }
sentinel-mcp = { workspace = true }
sentinel-protocol = { workspace = true }
sentinel-provider-info = { workspace = true }
sentinel-headroom = { workspace = true, optional = true }

[features]
default = ["headroom"]
headroom = ["dep:sentinel-headroom"]
