[package]
name = "sentinel-headroom"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Adaptive content compression for LLM context — compress tool outputs, logs, code, JSON, diffs before they reach the model"

[features]
default = []
code-aware = [
    "tree-sitter",
    "tree-sitter-rust",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
regex.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
lru.workspace = true
rusqlite.workspace = true
sha2.workspace = true
once_cell = "1"
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

tree-sitter = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }

sentinel-tools = { workspace = true }
sentinel-core = { workspace = true }
sentinel-protocol = { workspace = true }
