name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust formatting — Linux only (OS-independent output)
  # ---------------------------------------------------------------------------
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ---------------------------------------------------------------------------
  # Dependency auditing — unused / incorrect deps
  # ---------------------------------------------------------------------------
  shear:
    name: cargo shear
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-shear
        run: cargo install cargo-shear
      - uses: swatinem/rust-cache@v2
      - run: cargo shear --workspace

  # ---------------------------------------------------------------------------
  # Argument comment lint — cross-platform
  # ---------------------------------------------------------------------------
  arg-lint:
    name: Argument comment lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev, llvm-tools
      - name: Install cargo-dylint
        run: cargo install cargo-dylint
      - name: Build lint library
        run: cargo build --release --lib
        working-directory: tools/argument-comment-lint
      - name: Run linter
        run: cargo run --bin argument-comment-lint -- --check
        working-directory: tools/argument-comment-lint

  # ---------------------------------------------------------------------------
  # Unit + integration tests. Dummy AI keys let tests that touch provider
  # config/auth paths run without ever hitting a live, paid API.
  # ---------------------------------------------------------------------------
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENAI_API_KEY: sk-ci-dummy-not-a-real-key
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-not-a-real-key
      GEMINI_API_KEY: ci-dummy-gemini-key
      SENTINEL_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # ---------------------------------------------------------------------------
  # Security audit — fails the PR if any dependency has a known advisory
  # ---------------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Vulnerability scan
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Clippy — fast single-platform on all three Tier-1 platforms
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Bazel test — hermetic cross-platform build with BuildBuddy
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Mount Bazel cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'Cargo.lock') }}
          restore-keys: bazel-${{ runner.os }}-
      - name: Compute Windows PATH (Windows only)
        if: runner.os == 'Windows'
        run: pwsh -File .github/scripts/compute-bazel-windows-path.ps1
      - name: Test via Bazel CI wrapper
        run: bash .github/scripts/run-bazel-ci.sh test //... --test_output=errors


