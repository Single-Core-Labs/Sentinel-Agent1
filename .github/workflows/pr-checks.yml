name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust formatting — Linux only (OS-independent output)
  # ---------------------------------------------------------------------------
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # ---------------------------------------------------------------------------
  # Dependency auditing — unused / incorrect deps
  # ---------------------------------------------------------------------------
  shear:
    name: cargo shear
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-shear
        run: cargo install cargo-shear
      - uses: swatinem/rust-cache@v2
      - run: cargo shear --workspace

  # ---------------------------------------------------------------------------
  # Unit + integration tests. Dummy AI keys let tests that touch provider
  # config/auth paths run without ever hitting a live, paid API.
  # ---------------------------------------------------------------------------
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENAI_API_KEY: sk-ci-dummy-not-a-real-key
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-not-a-real-key
      GEMINI_API_KEY: ci-dummy-gemini-key
      SENTINEL_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  # ---------------------------------------------------------------------------
  # Security audit — fails the PR if any dependency has a known advisory
  # ---------------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Vulnerability scan
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Clippy �?" fast single-platform on all three Tier-1 platforms
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo clippy -p sentinel-cli -p sentinel-app-server --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Eval gate �?" ALWAYS_PASSES evals against a live LLM when a key exists.
  # ---------------------------------------------------------------------------
  evals:
    name: Evals (ALWAYS_PASSES)
    runs-on: ubuntu-latest
    if: secrets.ANTHROPIC_API_KEY != ''
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build --bin sentinel
      - uses: oven-sh/setup-bun@v2
      - name: Run ALWAYS_PASSES evals
        run: bun run evals:always
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SENTINEL_BIN: ${{ github.workspace }}/target/debug/sentinel
          SENTINEL_EVAL_MODEL: claude-3-5-haiku-20241022
          SENTINEL_NON_INTERACTIVE: '1'


