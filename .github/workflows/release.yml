name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p sentinel-cli

      - name: Package (tar)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sentinel dist/
          tar -czf sentinel-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz -C dist sentinel

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/sentinel.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath "sentinel-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: sentinel-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate changelog
        shell: bash
        run: |
          PREV=$(git tag --sort=-creatordate | sed -n '2p')
          {
            echo "## What's changed"
            echo
            if [ -n "$PREV" ]; then
              git log "$PREV"..HEAD --oneline --no-merges
            else
              git log --oneline --no-merges
            fi
          } > CHANGELOG.md

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: release-artifacts/**
          generate_release_notes: true
