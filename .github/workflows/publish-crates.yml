name: Publish to crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to publish (default: sentinel-cli + all unversioned deps)'
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Automatic crates.io publishing. For a workspace, cargo-smart-release walks
  # the dependency graph and publishes the requested crate plus any unpublished
  # workspace dependencies in the correct order (using git tags to detect what
  # has changed). Simulate first with `cargo smart-release --dry-run-cargo-publish`,
  # then ship with --execute.
  # ---------------------------------------------------------------------------
  publish:
    name: cargo smart-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SENTINEL_RELEASE_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-smart-release
        uses: taiki-e/install-action@cargo-smart-release

      - name: Validate workflow (no changes made)
        run: cargo smart-release --dry-run-cargo-publish ${{ inputs.crate }}

      - name: Publish to crates.io
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATES_IO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo smart-release \
            --execute \
            --allow-dirty \
            --no-changelog \
            ${{ inputs.crate }}