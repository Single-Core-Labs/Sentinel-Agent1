name: Main Branch

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: main-${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Clippy — stable on all tier-1 platforms (scoped to shipped crates)
  # ---------------------------------------------------------------------------
  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo clippy -p sentinel-cli --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Nextest matrix — parallel test execution
  # ---------------------------------------------------------------------------
  nextest:
    name: Nextest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Dummy API keys so provider/auth integration tests never hit a live
      # paid AI endpoint in CI; the CLI falls back to deterministic local paths.
      OPENAI_API_KEY: sk-ci-dummy-not-a-real-key
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-not-a-real-key
      GEMINI_API_KEY: ci-dummy-gemini-key
      SENTINEL_NON_INTERACTIVE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Run tests
        run: cargo nextest run --workspace --profile ci

  # ---------------------------------------------------------------------------
  # Dependency auditing — full matrix
  # ---------------------------------------------------------------------------
  shear:
    name: cargo shear (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-shear
        run: cargo install cargo-shear
      - uses: swatinem/rust-cache@v2
      - run: cargo shear --workspace

  # ---------------------------------------------------------------------------
  # Release build — full matrix
  # ---------------------------------------------------------------------------
  release-build:
    name: Release build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo build --release --workspace
