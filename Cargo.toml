[workspace]
resolver = "2"
members = [
    "crates/core/*",
    "crates/server/*",
    "crates/interfaces/*",
    "crates/tools-and-exec/*",
    "crates/platform/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
glob = "0.3"
colored = "2"
async-trait = "0.1"
tokio-stream = "0.1"
jsonwebtoken = "9"
ed25519-dalek = "2"
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
regex = "1"
futures = "0.3"
lru = "0.12"

# Sentinel Workspace Crates
sentinel-protocol = { path = "crates/core/sentinel-protocol" }
sentinel-core = { path = "crates/core/sentinel-core" }
sentinel-ai-core = { path = "crates/core/sentinel-ai-core" }
sentinel-app-server = { path = "crates/server/sentinel-app-server" }
sentinel-app-server-protocol = { path = "crates/server/sentinel-app-server-protocol" }
sentinel-app-server-client = { path = "crates/server/sentinel-app-server-client" }
sentinel-app-server-transport = { path = "crates/server/sentinel-app-server-transport" }
sentinel-cli = { path = "crates/interfaces/sentinel-cli" }
sentinel-exec = { path = "crates/tools-and-exec/sentinel-exec" }
sentinel-tools = { path = "crates/tools-and-exec/sentinel-tools" }
sentinel-mcp = { path = "crates/tools-and-exec/sentinel-mcp" }
sentinel-plugin-system = { path = "crates/tools-and-exec/sentinel-plugin-system" }
sentinel-config = { path = "crates/platform/sentinel-config" }
sentinel-provider = { path = "crates/platform/sentinel-provider" }
sentinel-provider-info = { path = "crates/platform/sentinel-provider-info" }
sentinel-agent-identity = { path = "crates/platform/sentinel-agent-identity" }
sentinel-agent-graph-store = { path = "crates/platform/sentinel-agent-graph-store" }
sentinel-analytics = { path = "crates/platform/sentinel-analytics" }
sentinel-headroom = { path = "crates/platform/sentinel-headroom" }
sentinel-proxy = { path = "crates/platform/sentinel-proxy" }

# Fast dev-loop compilation (issue #47, #50): keep debug builds light and
# incremental so the feedback cycle stays under ~2 minutes. Release builds
# stay optimized with link-time optimization.
[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 0

# Release binaries are shipped to users, so favor small/fast startup over size so
# download times stay low. Size is traded against raw throughput; add per-package
# `[profile.release.package.*]` overrides if any crate needs more optimization.
[profile.release]
opt-level = "s"        # Optimize for size while keeping some performance (use "z" for max size)
lto = true             # Link-time optimization
codegen-units = 1      # Single codegen unit for maximum inlining
panic = "abort"        # Smaller binaries; catch_unwind is only used in #[cfg(test)]
strip = true           # Remove debug symbols from shipped binaries

