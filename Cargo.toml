# Auto-generated workspace root. Prefer editing per-crate Cargo.toml files.

[patch.crates-io]
async-openai = { git = "https://github.com/our-forks/async-openai.git", rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }

[workspace]
resolver = "2"
members = [
    "crates/core/*",
    "crates/server/*",
    "crates/interfaces/*",
    "crates/tools-and-exec/*",
    "crates/platform/*",
    "crates/build/*",
    "crates/codegen/*",
    "crates/common/*",
    "prod/mc/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

